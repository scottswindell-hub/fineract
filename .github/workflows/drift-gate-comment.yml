name: CodeIntent Live Status Link

# This event runs the workflow from the trusted base branch, which gives the
# bot permission to comment even when the PR comes from a fork. Never checkout
# or execute pull-request code in this workflow.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post live analysis link
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- codeintent-live-governance -->';
            const { owner, repo } = context.repo;
            const number = context.issue.number;
            const sha = context.payload.pull_request.head.sha;
            const url = new URL('https://scottswindell-hub.github.io/fineract/');
            url.search = new URLSearchParams({
              sha,
              api: 'https://qgd63ljozc.execute-api.us-east-1.amazonaws.com/demo',
              pr: String(number),
              repo: `${owner}/${repo}`,
            });
            const body = `${marker}\n### CodeIntent analysis is starting\n\n` +
              `[▶ Watch the live governance analysis ↗](${url})\n\n` +
              `This page updates as the Lambda analyzes PR #${number} (\`${sha.slice(0, 7)}\`).`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: number, body,
              });
            }
